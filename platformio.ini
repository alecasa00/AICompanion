[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    links2004/WebSockets
    bblanchon/ArduinoJson
    adafruit/Adafruit SSD1306
build_flags =
    -DCORE_DEBUG_LEVEL=3

; Hardware is intentionally left configurable because the physical board and pins
; are not yet available. Update board, I2S pins and audio configuration when the
; final hardware is confirmed.
